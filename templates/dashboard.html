<section class="account-section">
    <h2>Owner Account</h2>

```
<form method="post" action="/owner/account" class="form">

    <label>
        New Username
        <input
            name="username"
            type="text"
            placeholder="New username"
            minlength="3"
            value="{{ owner.username }}"
            required
        >
    </label>

    <label>
        New Password
        <input
            name="password"
            type="password"
            placeholder="New password (minimum 8 characters)"
            minlength="8"
            required
        >
    </label>

    <button type="submit" class="btn">
        Change Login
    </button>

</form>
```

</section>
