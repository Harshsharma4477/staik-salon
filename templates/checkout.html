<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | {{ salon_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><style>.page{padding:45px 0;background:#f7f7f8;min-height:80vh}.checkout{display:grid;grid-template-columns:1.4fr .8fr;gap:24px}.card{background:#fff;border-radius:16px;padding:25px;box-shadow:0 6px 25px rgba(0,0,0,.06)}.form{display:grid;gap:13px}.form label{font-weight:700}.form input,.form textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary-item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.grand{font-size:22px;font-weight:800;display:flex;justify-content:space-between;margin-top:18px}@media(max-width:800px){.checkout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><header class="navbar"><div class="container nav-inner"><a href="{{ url_for('shop') }}" class="logo"><span>✦</span>Checkout</a><a href="{{ url_for('cart') }}" class="nav-button">← Cart</a></div></header><main class="page"><div class="container"><h1>Delivery Details</h1><div class="checkout"><section class="card"><form class="form" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="customer_name" required maxlength="100"></label><label>Phone<input name="phone" type="tel" required maxlength="20"></label><label>Full Address<textarea name="address" rows="4" required maxlength="500"></textarea></label><div class="row"><label>City<input name="city" required></label><label>PIN Code<input name="pincode" required maxlength="10"></label></div><label>Payment</label><div style="padding:13px;border:1px solid #ddd;border-radius:9px">💵 Cash on Delivery (COD)</div><button class="primary-button" type="submit">Place Order · {{ total|money }}</button><small>Your order will be created after you submit this form.</small></form></section><aside class="card"><h2>Order Summary</h2>{% for item in items %}<div class="summary-item"><span>{{ item.product['name'] }} × {{ item.quantity }}</span><strong>{{ item.line_total|money }}</strong></div>{% endfor %}<div class="grand"><span>Total</span><span>{{ total|money }}</span></div></aside></div></div></main></body></html>
