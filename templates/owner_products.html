<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | {{ salon_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><style>.page{padding:35px 0;background:#f7f7f8;min-height:90vh}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:22px;box-shadow:0 6px 25px rgba(0,0,0,.06)}.form{display:grid;gap:10px}.form input,.form textarea{padding:11px;border:1px solid #ddd;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.product{border:1px solid #eee;border-radius:12px;padding:16px}.product img{width:100%;height:170px;object-fit:cover;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:9px 12px;border:0;border-radius:7px;background:#111;color:#fff;cursor:pointer}.danger{background:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="dashboard-header"><div class="container dashboard-header-inner"><div><h1 class="dashboard-title">🛍️ Product Management</h1><p class="dashboard-subtitle">Manage your salon shop inventory.</p></div><a href="{{ url_for('dashboard') }}" class="logout-btn">Dashboard</a></div></header><main class="page"><div class="container"><div class="card"><h2>Add Product</h2><form class="form" method="POST" action="{{ url_for('add_product') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" placeholder="Product name" required><textarea name="description" placeholder="Description"></textarea><input name="image_url" placeholder="Image URL (optional)"><div class="row"><input type="number" name="price" min="0" placeholder="Price" required><input type="number" name="stock" min="0" placeholder="Stock" required></div><button class="btn">Add Product</button></form></div><div class="grid">{% for p in products %}<div class="product"><form class="form" method="POST" action="{{ url_for('update_product', product_id=p['id']) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if p['image_url'] %}<img src="{{ p['image_url'] }}" alt="">{% endif %}<input name="name" value="{{ p['name'] }}" required><textarea name="description">{{ p['description'] }}</textarea><input name="image_url" value="{{ p['image_url'] }}"><div class="row"><input type="number" name="price" value="{{ p['price'] }}" min="0"><input type="number" name="stock" value="{{ p['stock'] }}" min="0"></div><small>Status: {% if p['active'] %}Visible{% else %}Hidden{% endif %}</small><button class="btn">Save Changes</button></form><div style="display:flex;gap:8px;margin-top:8px"><form method="POST" action="{{ url_for('toggle_product', product_id=p['id']) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn" type="submit">{% if p['active'] %}Hide{% else %}Show{% endif %}</button></form><form method="POST" action="{{ url_for('delete_product', product_id=p['id']) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn danger" type="submit">Hide Product</button></form></div></div>{% endfor %}</div></div></main></body></html>
